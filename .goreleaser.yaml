version: 2
builds:
  - main: ./cmd/websearch
    binary: websearch
    env: [CGO_ENABLED=0]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    name_template: "websearch_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, skills/websearch/SKILL.md]
checksum:
  name_template: checksums.txt
