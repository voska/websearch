version: 2
builds:
  - main: ./cmd/websearch
    binary: websearch
    env: [CGO_ENABLED=0]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    name_template: "websearch_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, skills/websearch/SKILL.md]
checksum:
  name_template: checksums.txt
brews:
  - name: websearch
    directory: Formula
    homepage: "https://github.com/voska/websearch"
    description: "Search the web through the Voska LiteLLM proxy"
    license: MIT
    repository:
      owner: voska
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: voska-bot
      email: bot@voska.dev
    install: |
      bin.install "websearch"
      pkgshare.install "skills"
    test: |
      system "#{bin}/websearch", "--version"
